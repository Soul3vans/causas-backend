version: '3.8'
services:

  # --- BASE DE DATOS ---
  mongo:
    image: mongo:6.0
    container_name: causas_mongo
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    networks:
      - causas_net
    deploy:
      resources:
        limits:
          memory: 700M

  # --- COLA DE TRABAJOS Y CACHÉ ---
  redis:
    image: redis:7-alpine
    container_name: causas_redis
    restart: always
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - causas_net
    deploy:
      resources:
        limits:
          memory: 150M

  # --- BACKEND (Node + Express + Apollo + Puppeteer) ---
  backend:
    build:
      context: .
      dockerfile: Containerfile
    container_name: causas_backend
    restart: always
    ports:
      - "4000:4000"
      - "6080:6080"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=causas_concursales
      - REDIS_URL=redis://redis:6379
      - SECRET=${SECRET}
      - CORS_ORIGIN_URI=${CORS_ORIGIN_URI}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - SCRAPER_DEBUG=${SCRAPER_DEBUG:-0}
      - CHROME_PROFILE_DIR=/data/chrome-profile
    depends_on:
      - mongo
      - redis
    networks:
      - causas_net
    volumes:
    - chrome_profile:/data/chrome-profile
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

volumes:
  mongo_data:
  redis_data:
  chrome_profile:

networks:
  causas_net:
    driver: bridge